services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sheria
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: sheria_check
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheria -d sheria_check"]
      interval: 10s
      timeout: 5s
      retries: 5
  server:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sheria:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/sheria_check
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a long ADMIN_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set the HTTPS web origin}
      NODE_ENV: production
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PG_POOL_SIZE: ${PG_POOL_SIZE:-20}
      TRUST_PROXY: "1"
    depends_on:
      db:
        condition: service_healthy
  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLIENT_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
volumes:
  pgdata:
