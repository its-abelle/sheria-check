# TLS terminates at the host reverse proxy. Do not retain searches or client addresses.
# The outer loopback-only TLS proxy overwrites X-Real-IP. Use it transiently for
# API rate limiting; neither proxy retains address/query logs.
map $http_x_real_ip $client_address {
    "" $remote_addr;
    default $http_x_real_ip;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    error_log /dev/null crit;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location /api/ {
        proxy_pass http://server:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_address;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin {
        proxy_pass http://server:4000;
        proxy_set_header X-Forwarded-For $client_address;
    }
    location / { try_files $uri $uri/ /index.html; }
}
